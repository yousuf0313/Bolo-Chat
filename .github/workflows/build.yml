name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Extract Project Files
        run: |
          unzip -o "Bolo Chat Source.zip" || unzip -o "*.zip"
          rm -f bun.lock package-lock.json
          ls

      - name: Point SDK at repo tarball
        run: |
          python3 -c "
          import json
          p = json.load(open('package.json'))
          p['dependencies']['@hatch/space-sdk'] = 'file:./space-sdk.tgz'
          json.dump(p, open('package.json', 'w'), indent=2)
          print('sdk path:', p['dependencies']['@hatch/space-sdk'])
          "
          ls -la space-sdk.tgz

      - name: Install Bun
        uses: oven-sh/setup-bun@v1

      - name: Install Dependencies
        run: bun install

      - name: Add web build tools
        run: bun add -d vite @vitejs/plugin-react @tailwindcss/vite

      - name: Write Vite config
        run: |
          cat > client/vite.config.ts <<'VITEOF'
          import { defineConfig } from "vite";
          import react from "@vitejs/plugin-react";
          import tailwindcss from "@tailwindcss/vite";

          export default defineConfig({
            plugins: [react(), tailwindcss()],
            root: "client",
            build: { outDir: "dist", emptyOutDir: true },
          });
          VITEOF
          cat client/vite.config.ts

      - name: Build Web Assets
        run: bun x vite build --config client/vite.config.ts

      - name: Setup Capacitor
        run: |
          bun add @capacitor/core @capacitor/cli @capacitor/android
          bun x cap init "Bolo Chat" "com.bolochat.app" --web-dir client/dist
          bun x cap add android
          bun x cap copy

      - name: Add Android Permissions
        run: |
          python3 - <<'PYEOF'
          import re
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p).read()
          insert = (
              '\n'
              '    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n'
              '    <uses-permission android:name="android.permission.CAMERA" />\n'
              '    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n'
              '    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />\n'
              '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n'
          )
          if 'android.permission.RECORD_AUDIO' not in s:
              s = re.sub(r'(<manifest[^>]*>)', lambda m: m.group(1) + insert, s, count=1)
              open(p, 'w').write(s)
              print('permissions added')
          else:
              print('permissions already present')
          PYEOF
          grep "uses-permission" android/app/src/main/AndroidManifest.xml

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bolo-chat-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
